<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="bg-crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C22847" />
      <stop offset="60%" stop-color="#E34060" />
      <stop offset="100%" stop-color="#80142B" />
    </linearGradient>

    <radialGradient id="stage-glow-crimson" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFD1DC" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#A81E3B" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#80142B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-crimson)" />
  <rect width="1200" height="675" fill="url(#stage-glow-crimson)" />

  <!-- Soft Stage Horizon Curve -->
  <path d="M0,520 Q600,450 1200,520" stroke="white" stroke-opacity="0.15" stroke-width="1.5" fill="none" />

  <!-- Acoustic Cello & Strings Silhouette Contours (Event Related) -->
  <g transform="translate(480, 110)" stroke="white" stroke-opacity="0.38" stroke-width="1.8" fill="none">
    <!-- Cello Body -->
    <path d="M120,40 C170,40 210,75 210,120 C210,150 190,175 160,195 C195,215 225,255 225,320 C225,390 170,450 120,450 C70,450 15,390 15,320 C15,255 45,215 80,195 C50,175 30,150 30,120 C30,75 70,40 120,40 Z" />
    
    <!-- Cello F-holes (classical acoustic event icon) -->
    <path d="M75,230 C70,250 85,270 75,290" stroke="white" stroke-opacity="0.5" stroke-width="2.5" stroke-linecap="round" />
    <path d="M165,230 C170,250 155,270 165,290" stroke="white" stroke-opacity="0.5" stroke-width="2.5" stroke-linecap="round" />

    <!-- Tailpiece & Strings -->
    <line x1="120" y1="20" x2="120" y2="440" stroke="white" stroke-opacity="0.45" stroke-width="1" />
    <line x1="113" y1="20" x2="113" y2="440" stroke="white" stroke-opacity="0.3" stroke-width="1" />
    <line x1="127" y1="20" x2="127" y2="440" stroke="white" stroke-opacity="0.3" stroke-width="1" />
  </g>

  <!-- Ambient Acoustic Reverberation Ripples -->
  <circle cx="600" cy="300" r="160" stroke="white" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="600" cy="300" r="240" stroke="white" stroke-opacity="0.06" stroke-width="1.5" stroke-dasharray="10 8" />
  <circle cx="600" cy="300" r="330" stroke="white" stroke-opacity="0.04" stroke-width="1.5" />

  <!-- Subtle Audience Intimate Seating Dots Curve -->
  <g fill="white" fill-opacity="0.18">
    <circle cx="280" cy="540" r="3" />
    <circle cx="340" cy="525" r="3" />
    <circle cx="400" cy="515" r="3" />
    <circle cx="460" cy="510" r="3.5" />
    <circle cx="740" cy="510" r="3.5" />
    <circle cx="800" cy="515" r="3" />
    <circle cx="860" cy="525" r="3" />
    <circle cx="920" cy="540" r="3" />
  </g>
</svg>
