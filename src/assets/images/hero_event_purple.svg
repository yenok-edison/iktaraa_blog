<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="bg-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B0764" />
      <stop offset="50%" stop-color="#581C87" />
      <stop offset="100%" stop-color="#2E1065" />
    </linearGradient>

    <radialGradient id="purple-glow" cx="60%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#2E1065" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-purple)" />
  <rect width="1200" height="675" fill="url(#purple-glow)" />

  <!-- Studio Acoustic Frequency Spectrum Lines (Event/Studio Related) -->
  <g stroke="white" stroke-opacity="0.12" stroke-width="1.2">
    <line x1="100" y1="520" x2="1100" y2="520" />
    <line x1="100" y1="560" x2="1100" y2="560" stroke-dasharray="4 4" />
  </g>

  <!-- Vinyl Record & Tape Reel Grooves (Acoustic Residency Motifs) -->
  <g transform="translate(680, 260)" stroke="white" stroke-width="1.2" fill="none">
    <circle cx="0" cy="0" r="190" stroke-opacity="0.18" />
    <circle cx="0" cy="0" r="160" stroke-opacity="0.12" stroke-dasharray="12 4" />
    <circle cx="0" cy="0" r="130" stroke-opacity="0.1" />
    <circle cx="0" cy="0" r="95" stroke-opacity="0.18" />
    <circle cx="0" cy="0" r="45" stroke-opacity="0.3" stroke-width="2" />
    <circle cx="0" cy="0" r="12" fill="white" fill-opacity="0.25" />
  </g>

  <!-- Vintage Acoustic Ribbon Microphone Outline (Left/Center) -->
  <g transform="translate(320, 150)" stroke="white" stroke-opacity="0.38" stroke-width="2" fill="none">
    <!-- Mic Capsule Grill -->
    <rect x="50" y="40" width="70" height="150" rx="35" stroke-width="2.5" />
    <line x1="65" y1="70" x2="105" y2="70" stroke-opacity="0.3" />
    <line x1="60" y1="95" x2="110" y2="95" stroke-opacity="0.3" />
    <line x1="60" y1="120" x2="110" y2="120" stroke-opacity="0.3" />
    <line x1="65" y1="145" x2="105" y2="145" stroke-opacity="0.3" />
    <!-- Stand U-Mount & Post -->
    <path d="M30,120 C30,195 140,195 140,120" stroke-width="2.5" />
    <line x1="85" y1="195" x2="85" y2="340" stroke-width="3" />
    <line x1="45" y1="340" x2="125" y2="340" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Sound Dispersion Waves -->
  <path d="M480,240 Q550,210 600,240 T720,240" stroke="#C084FC" stroke-opacity="0.25" stroke-width="1.8" fill="none" />
</svg>
