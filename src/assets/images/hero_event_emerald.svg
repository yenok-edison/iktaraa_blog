<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="bg-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022C22" />
      <stop offset="50%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <radialGradient id="emerald-glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#A7F3D0" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#022C22" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-emerald)" />
  <rect width="1200" height="675" fill="url(#emerald-glow)" />

  <!-- Studio Audio Master Headphones (Sound Lab Webinar Motif) -->
  <g transform="translate(620, 160)" stroke="white" stroke-width="2.2" stroke-opacity="0.45" fill="none">
    <!-- Headband Arc -->
    <path d="M40,240 C40,90 260,90 260,240" stroke-width="3" />
    <path d="M55,220 C55,110 245,110 245,220" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4 4" />
    <!-- Left Ear Cup -->
    <rect x="20" y="220" width="40" height="90" rx="18" stroke-width="2.5" />
    <circle cx="40" cy="265" r="8" fill="white" fill-opacity="0.3" />
    <!-- Right Ear Cup -->
    <rect x="240" y="220" width="40" height="90" rx="18" stroke-width="2.5" />
    <circle cx="260" cy="265" r="8" fill="white" fill-opacity="0.3" />
  </g>

  <!-- Sound Lab Audio Waveform / Acoustic Spectrum Bars (Left Side) -->
  <g transform="translate(140, 240)" fill="white" fill-opacity="0.25">
    <rect x="0" y="80" width="8" height="60" rx="4" />
    <rect x="24" y="50" width="8" height="120" rx="4" />
    <rect x="48" y="20" width="8" height="180" rx="4" fill-opacity="0.35" />
    <rect x="72" y="60" width="8" height="100" rx="4" />
    <rect x="96" y="90" width="8" height="40" rx="4" />
    <rect x="120" y="40" width="8" height="140" rx="4" />
    <rect x="144" y="10" width="8" height="200" rx="4" fill-opacity="0.4" />
    <rect x="168" y="45" width="8" height="130" rx="4" />
    <rect x="192" y="70" width="8" height="80" rx="4" />
    <rect x="216" y="30" width="8" height="160" rx="4" />
    <rect x="240" y="85" width="8" height="50" rx="4" />
    <rect x="264" y="55" width="8" height="110" rx="4" />
    <rect x="288" y="25" width="8" height="170" rx="4" fill-opacity="0.35" />
    <rect x="312" y="75" width="8" height="70" rx="4" />
  </g>

  <!-- Frequency Grid Accent Line -->
  <line x1="80" y1="520" x2="1120" y2="520" stroke="white" stroke-opacity="0.15" stroke-width="1.5" />
</svg>
